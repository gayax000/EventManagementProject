name: Flutter Web Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'mobile-app/**'

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install Dependencies
        working-directory: ./mobile-app
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: ./mobile-app
        run: flutter build web --release --pwa-strategy none

      - name: Copy build to mobile-web folder
        run: |
          cp -R mobile-app/build/web/* mobile-web/
          cat << 'EOF' > mobile-web/flutter_service_worker.js
          'use strict';
          self.addEventListener('install', (e) => { self.skipWaiting(); });
          self.addEventListener('activate', (e) => {
            e.waitUntil(
              caches.keys().then((keys) => Promise.all(keys.map((k) => caches.delete(k))))
                .then(() => self.clients.claim())
                .then(() => self.registration.unregister())
            );
          });
          self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request)); });
          EOF
          sed -i 's/serviceWorkerSettings: {[^}]*}/serviceWorkerSettings: null/g' mobile-web/flutter_bootstrap.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile-web/
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-build flutter web [skip ci]"
            git push
          fi
