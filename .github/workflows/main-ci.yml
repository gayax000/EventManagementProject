name: EventCraft End-to-End CI Pipeline

on:
  push:
    branches: [ main, fix/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-test:
    name: ASP.NET Core 8 Web API Tests
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__DefaultConnection: ${{ secrets.NEON_DB_CONNECTION_STRING || 'Host=localhost;Database=testdb;Username=postgres;Password=postgres' }}
      JwtSettings__SecretKey: ${{ secrets.JWT_SECRET_KEY || 'SuperSecretKeyForJwtTokenGeneration2026!EventCraftProject' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore backend/EventManagement.Tests/EventManagement.Tests.csproj
      - name: Build
        run: dotnet build backend/EventManagement.Tests/EventManagement.Tests.csproj --no-restore
      - name: Test
        run: dotnet test backend/EventManagement.Tests/EventManagement.Tests.csproj --no-build --verbosity normal

  ai-subsystem-test:
    name: Agentic AI Python Subsystem Tests
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-ci-dummy-key' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-dummy-key' }}
      NEON_POSTGRES_URL: ${{ secrets.NEON_POSTGRES_URL || 'postgresql://localhost:5432/dummy' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          cd ai-service
          pip install -r requirements.txt
      - name: Run AI Evaluation Unit Tests
        run: |
          cd ai-service
          python -m unittest test_agent_evaluation.py

  frontend-react-build:
    name: React Web Application Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install, Test & Build
        run: |
          cd frontend-web
          npm ci
          npm test
          npm run build

  flutter-app:
    name: Flutter Mobile Application Tests & APK Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      - name: Configure Flutter SDK Environment
        run: |
          FLUTTER_ROOT_DIR=$(dirname $(dirname $(which flutter)))
          echo "FLUTTER_ROOT=$FLUTTER_ROOT_DIR" >> $GITHUB_ENV
          echo "FLUTTER_HOME=$FLUTTER_ROOT_DIR" >> $GITHUB_ENV
          echo "Discovered FLUTTER_ROOT: $FLUTTER_ROOT_DIR"
      - name: Accept Android Licenses & Pre-configure
        run: |
          yes "y" | flutter doctor --android-licenses || true
          flutter doctor -v
      - name: Install, Analyze & Test
        run: |
          cd mobile-app
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
      - name: Build Android Release APK
        run: |
          cd mobile-app
          mkdir -p android
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          echo "flutter.buildMode=release" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          echo "Generated local.properties:"
          cat android/local.properties
          flutter build apk --release --no-tree-shake-icons --verbose
          ls -lh build/app/outputs/flutter-apk/
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile-app/build/app/outputs/flutter-apk/app-release.apk
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-latest
          name: EventCraft Mobile App Latest Release
          body: |
            ### EventCraft Mobile Application - Latest Release APK
            - **Feature Fix:** Unlocked Signature Pad & Entry Pass minting when payment is verified by manager.
            - **Download:** Download `app-release.apk` directly to your Android device and install.
          files: mobile-app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

