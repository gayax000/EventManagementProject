pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = file("local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { properties.load(it) }
        }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        if (flutterSdkPath == null || flutterSdkPath.trim().isEmpty()) {
            flutterSdkPath = System.getenv("FLUTTER_ROOT") ?: System.getenv("FLUTTER_HOME")
        }
        if (flutterSdkPath == null || flutterSdkPath.trim().isEmpty()) {
            def pathDirs = System.getenv("PATH")?.split(File.pathSeparator) ?: []
            for (String dir : pathDirs) {
                def flutterBin = new File(dir, "flutter")
                def flutterBat = new File(dir, "flutter.bat")
                if (flutterBin.exists() || flutterBat.exists()) {
                    flutterSdkPath = new File(dir).parent
                    break
                }
            }
        }
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties, FLUTTER_ROOT, or PATH"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.4.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.20" apply false
}

include ":app"
